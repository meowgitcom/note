name = "meownote-api"
main = "worker.ts"
compatibility_date = "2026-04-18"

[dev]
port = 3000
local_protocol = "http"

# Wrangler runs its own dev server. We keep the port in the shared `env` package.

[[d1_databases]]
binding = "DB"
database_name = "meownote-api-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./drizzle/migrations"
